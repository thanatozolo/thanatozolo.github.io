<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书籍预览测试</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#181818;color:#eee;padding:24px;font-family:system-ui}
        h1{margin-bottom:24px}
        a{color:#42a5f5;display:block;margin:10px 0;font-size:18px}
        #pdf-container{width:100%;height:85vh;margin-top:20px;border:1px solid #444}
    </style>
    <!-- 使用CDN加载PDF.js，不用下载文件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body>
    <h1>书籍列表</h1>
    <!-- 把你的pdf上传到仓库，这里写你的pdf文件名 -->
    <a href="javascript:openPdf('test.pdf')">打开 test.pdf</a>
    <div id="pdf-container"></div>

    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        async function openPdf(pdfPath){
            const container = document.getElementById('pdf-container');
            container.innerHTML = "";
            const pdfDoc = await pdfjsLib.getDocument(pdfPath).promise;
            const page = await pdfDoc.getPage(1);
            const scale = 1.5;
            const viewport = page.getViewport({scale});

            const canvas = document.createElement('canvas');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            await page.render({canvasContext:ctx,viewport:viewport}).promise;
        }
    </script>
</body>
</html>
